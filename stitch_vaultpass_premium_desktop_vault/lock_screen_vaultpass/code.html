<style>
        body {
            background-color: #0B0C0E;
            background-image: radial-gradient(circle at 50% -20%, #1a1e28 0%, #0B0C0E 70%);
            color: theme('colors.on-surface');
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-cell {
            background-color: #16171A;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .input-glass {
            background-color: #16171A;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            transition: all 0.2s ease;
        }

        .input-glass:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 1px theme('colors.primary');
        }

        .btn-primary {
            background-color: theme('colors.primary');
            color: theme('colors.on-primary');
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: theme('colors.primary-fixed-dim');
            transform: translateY(-1px);
        }

        .btn-ghost {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: theme('colors.on-surface');
            transition: all 0.2s ease;
        }

        .btn-ghost:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Input specific styling to remove default webkit styles */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
</head>
<body class="font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppress Main Nav & FAB for linear transactional intent -->
<main class="w-full max-w-[420px] px-md">
<!-- Bento Cell Container -->
<div class="glass-cell rounded-xl p-[32px] flex flex-col items-center shadow-2xl relative overflow-hidden">
<!-- Subtle ambient glow top right inside the cell -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary rounded-full blur-[80px] opacity-10 pointer-events-none"></div>
<!-- Logo Area -->
<div class="mb-lg flex flex-col items-center space-y-sm w-full">
<img alt="VaultPass Logo" class="w-[80px] h-[80px] object-contain drop-shadow-lg" src="https://lh3.googleusercontent.com/aida/AP1WRLtTfJ3kOlo9gb-JTuNtuJJuAEgJCwEdaGkZwKX_marULikmea_LgrE3JA-tH7jAnPxQnsq9htjKwELKS3VgJKZePPXNv_Bu7TRG5TmYIx_--Cvs756S_EZjnSmiLzKM0OD9OXF0T7SWEKw1S2bX2kajKpuyIVcnK9HFK1qhsvOaB5TtjoMTEiHvwAS_JJ5VuU-r3s7aQkow6Gpps6mDbVS5h7XfJTxGsLFKN6N43XEdABOWyT03PsHZHg"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mt-sm">VaultPass</h1>
</div>
<!-- Authentication Form -->
<form class="w-full flex flex-col gap-lg mt-sm">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="master-password">Master Password</label>
<div class="relative w-full">
<input autocomplete="current-password" class="input-glass w-full rounded-lg h-[48px] px-md font-body-lg text-body-lg" id="master-password" placeholder="••••••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-full px-md text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors focus:outline-none focus:text-primary group" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-md">
<button class="btn-primary w-full h-[48px] rounded-lg font-label-md text-label-md flex items-center justify-center gap-sm" type="submit">
<span class="material-symbols-outlined text-[18px]">lock_open</span>
                        Unlock Vault
                    </button>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink-0 mx-md text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">Or</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<button class="btn-ghost w-full h-[48px] rounded-lg font-label-md text-label-md flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
                        Use Touch ID
                    </button>
</div>
</form>
</div>
<!-- Bottom Links -->
<div class="mt-lg flex justify-between items-center px-sm w-full">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors focus:outline-none">Forgot Password?</button>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors focus:outline-none">Switch User</button>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('master-password');
            const icon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
